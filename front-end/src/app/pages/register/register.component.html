<div class="ContainerRegisterForm">
  <form class="FormRegister">
    <div>
      <label>
        <input class="InputName" type="text" placeholder="nome completo" required />
      </label>
    </div>
    <div>
      <label>
        <input class="InputEmail" type="email" placeholder="email" required />
      </label>
    </div>
    <div>
      <label>
        <input class="InputPassword" type="password" placeholder="senha" required />
      </label>
    </div>
    <div>
      <label>
        <input
          class="InputPassword"
          type="password"
          placeholder="repetir senha"
          required
        />
      </label>
    </div>
    <div>
      <label>
        <input class="InputDate" type="date" placeholder="aniversário" required />
      </label>
    </div>
    <div>
      <label>
        <input class="InputPhone" type="tel" placeholder="telefone" required />
      </label>
    </div>
    <div>
      <a href="/forgot-password">Esqueceu a senha?</a>
    </div>
    <input class="InputSubmit" type="submit" value="Login" required />
  </form>
</div>
