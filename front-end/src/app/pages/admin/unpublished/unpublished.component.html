<main class="main-container">
  <section class="section-posts">
    <ul class="list-posts">
      <li *ngFor="let post of posts">
        <article>
          <a href="/">
            <img src="/assets/Images/justica.jpg" alt="{{ post.title }}" />
          </a>
          <div></div>

          <h3>{{ post.title }}</h3>
          <p>
            <strong>Autor: {{ post.author.name }}</strong>
          </p>
          <p>
            <strong>Criado em: {{ post.created_at }}</strong>
          </p>
        </article>
      </li>
    </ul>
  </section>
</main>
